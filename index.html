<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дота2 скачать читы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2 class="logo">calculate</h2>

        <div class="mode" id="mode">
            <button class="btnMode" id="btnMode">|||</button>

            <div class="modeMenu" id="modeMenu" hidden>
                <button id="standart">Стандартный</button>
                <button id="qwin">Qwin</button>
                <button id="hueta">Hueta</button>
            </div>

        </div>
    </header>

    <main>

        <section class="standartMode" id="standartMode">
            <input type="text" id="userInput" placeholder="Введите число" value="">
            <button class="knopka" id="knopka">Посчитать</button>
            <div class="all-output">
                <div class="firstOutput" id="firstOutput"></div>
                <div class="operOutput" id="operOutput"></div>
                <div class="twoOutput" id="twoOutput"></div>
            </div>
        </section>

        <section class="huetaMode" id="huetaMode" hidden>
            <input type="text" id="userInput" placeholder="Введите число" value="">
            <div id="dropbtn">
                <button id="plus"></button>
                <button id="minus"></button>
                <button id="multiplication"></button>
                <button id="division"></button>
            </div>
            <button class="knopka" id="knopka">Посчитать</button>
        </section>

<section class="qwinMode" id="qwinMode" hidden>
    <div class="calc">
        <div class="calc-display">
            <div class="calc-expression" id="qwinExpression"></div>
            <div class="calc-value" id="qwinValue">0</div>
        </div>

        <div class="calc-keys" id="qwinKeys">
            <button type="button" class="key key-fn" data-key="%">%</button>
            <button type="button" class="key key-fn" data-key="Delete" aria-label="Очистить ввод">CE</button>
            <button type="button" class="key key-fn" data-key="Escape" aria-label="Очистить всё">C</button>
            <button type="button" class="key key-fn" data-key="Backspace" aria-label="Стереть символ">⌫</button>

            <button type="button" class="key key-fn" data-key="reciprocal" aria-label="Обратное число">1/x</button>
            <button type="button" class="key key-fn" data-key="square" aria-label="Квадрат">x²</button>
            <button type="button" class="key key-fn" data-key="sqrt" aria-label="Квадратный корень">√x</button>
            <button type="button" class="key key-op" data-key="/" aria-label="Разделить">÷</button>

            <button type="button" class="key" data-key="7">7</button>
            <button type="button" class="key" data-key="8">8</button>
            <button type="button" class="key" data-key="9">9</button>
            <button type="button" class="key key-op" data-key="*" aria-label="Умножить">×</button>

            <button type="button" class="key" data-key="4">4</button>
            <button type="button" class="key" data-key="5">5</button>
            <button type="button" class="key" data-key="6">6</button>
            <button type="button" class="key key-op" data-key="-" aria-label="Вычесть">−</button>

            <button type="button" class="key" data-key="1">1</button>
            <button type="button" class="key" data-key="2">2</button>
            <button type="button" class="key" data-key="3">3</button>
            <button type="button" class="key key-op" data-key="+" aria-label="Сложить">+</button>

            <button type="button" class="key" data-key="negate" aria-label="Сменить знак">±</button>
            <button type="button" class="key" data-key="0">0</button>
            <button type="button" class="key" data-key=".">,</button>
            <button type="button" class="key key-equals" data-key="=" aria-label="Равно">=</button>
        </div>
    </div>
</section>

    </main>
    <script type="module" src="scripts/script.js"></script>

</body>

</html>
